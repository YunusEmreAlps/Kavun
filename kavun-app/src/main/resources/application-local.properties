# ===============================
# = LOCAL OVERRIDES
# ===============================
# This is an overlay on top of the development profile, not a
# standalone profile. Run it as:
#
#   SPRING_PROFILES_ACTIVE=development,local ./gradlew bootRun
#
# Order matters: `local` must come last so its values win (last-wins strategy).
# Activating `local` on its own starts the app WITHOUT the beans registered for
# `development` (EmailService, SmsService, S3Client) and without any logback
# appender - nothing here is bound to the `local` profile name in code.

# ===============================
# = DEVTOOLS
# ===============================
# Only takes effect under `./gradlew bootRun`: spring-boot-devtools is a
# developmentOnly dependency and is not packaged into the boot jar.
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ===============================
# = MACHINE-SPECIFIC OVERRIDES
# ===============================
# Keep only what actually differs on this machine; everything else is inherited
# from application.properties and the platform's development defaults
# (kavun-defaults-development.properties).
# spring.datasource.url=jdbc:postgresql://localhost:5432/kavun
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.mail.host=localhost
# logging.level.com.kavun=TRACE
