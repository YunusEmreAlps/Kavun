<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<th:block th:replace="~{common/email/email-template :: common-head}"/>

<body style="background-color: #f3f5f7; margin: 0 !important; padding: 0 !important;">

<!-- HIDDEN PREHEADER TEXT -->
<th:block
    th:replace="~{common/email/email-template :: common-pre-header (text='Your one-time verification code')}"/>

<table bgcolor="#f3f5f7" border="0" cellpadding="0" cellspacing="0" role="presentation"
       width="100%">

  <!-- LOGO -->
  <th:block th:replace="~{common/email/email-template :: common-logo}"/>

  <!-- HERO -->
  <th:block
      th:replace="~{common/email/email-template :: common-hero (salutation='Your verification code')}"/>

  <!-- COPY BLOCK -->
  <tr>
    <td align="center" style="padding: 0px 10px 0px 10px;">
      <!--[if (gte mso 9)|(IE)]>
      <table align="center" border="0" cellspacing="0" cellpadding="0" width="600">
        <tr>
          <td align="center" valign="top" width="600">
      <![endif]-->
      <table border="0" cellpadding="0" cellspacing="0" style="max-width: 600px;" width="100%">
        <!-- COPY -->
        <tr>
          <td align="left" bgcolor="#ffffff"
              style="padding: 20px 30px 20px 30px; color: #666666; font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 400; line-height: 25px;">
            <p style="margin: 0;">Hi <span th:text="${username}">User</span>, use the code below
              to complete your sign-in. The code can only be used once and expires shortly.</p>
          </td>
        </tr>

        <!-- CODE -->
        <tr>
          <td align="center" bgcolor="#ffffff" style="padding: 10px 30px 40px 30px;">
            <span
                style="display: inline-block; padding: 12px 30px; border: 1px solid #398bf7; border-radius: 3px; color: #398bf7; font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: 700; letter-spacing: 8px;"
                th:text="${otpCode}">000000</span>
          </td>
        </tr>
        <!-- COPY -->
        <tr>
          <td align="left" bgcolor="#ffffff"
              style="padding: 0px 30px 20px 30px; color: #aaaaaa; font-family: &apos;Poppins&apos;, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; line-height: 25px;">
            <p style="margin: 0; text-align: center;">If you did not try to sign in, ignore this
              email and consider changing your password. Never share this code with anyone.</p>
          </td>
        </tr>
        <!-- COPY -->
        <tr>
          <td align="left" bgcolor="#ffffff"
              style="padding: 0px 30px 40px 30px; border-radius: 0px 0px 0px 0px; color: #666666; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 400; line-height: 25px;">
            <p style="margin: 0;">Cheers,<br>Team</p>
          </td>
        </tr>
      </table>
      <!--[if (gte mso 9)|(IE)]>
      </td>
      </tr>
      </table>
      <![endif]-->
    </td>
  </tr>

  <!-- SUPPORT CALLOUT -->
  <tr th:replace="~{common/email/email-template :: common-support-callout}"></tr>

  <!-- FOOTER -->
  <tr th:replace="~{common/email/email-template :: common-footer}"></tr>

</table>

</body>

</html>
