// The plugin versions of all modules; each module applies the plugins it needs.
plugins {
  id 'org.springframework.boot' version '3.5.12' apply false
  id 'io.spring.dependency-management' version '1.1.7' apply false
  id 'org.owasp.dependencycheck' version '11.1.1' apply false
  id 'com.diffplug.spotless' version '7.0.2'
}

spotless {
  format 'misc', {
    // define the files to apply `misc` to
    target '*.gradle', '*.md', '.gitignore'

    // define the steps to apply to those files
    trimTrailingWhitespace()
    leadingTabsToSpaces()
    // indentWithSpaces()
    endWithNewline()
  }
}

// Formatted on every build like the modules' sources, instead of failing the build
tasks.named('check') {
  dependsOn 'spotlessApply'
}
